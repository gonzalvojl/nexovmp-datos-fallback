name: NexoVMP · Servidor secundario

on:
  workflow_dispatch:
  schedule:
    - cron: "45 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexovmp-fallback-pages
  cancel-in-progress: false

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Construir mirror validado
        run: python3 tools/mirror_primary.py

      - name: Verificar contenido generado
        shell: bash
        run: |
          set -euo pipefail

          test -s site/index.html
          test -s site/manifest.json
          test -s site/nexovmp_catalog.json
          test -s site/municipal/manifest.json

          echo "Contenido validado:"
          find site -maxdepth 3 -type f -print | sort

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Confirmar URL publicada
        shell: bash
        run: |
          echo "Servidor secundario publicado en:"
          echo "${{ steps.deployment.outputs.page_url }}"
