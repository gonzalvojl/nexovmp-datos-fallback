name: NexoVMP · Servidor secundario

on:
  workflow_dispatch:
  schedule:
    - cron: "45 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nexovmp-fallback-pages
  cancel-in-progress: false

jobs:
  mirror-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Construir mirror validado
        run: python3 tools/mirror_primary.py

      - name: Verificar contenido generado
        shell: bash
        run: |
          set -euo pipefail

          test -s site/index.html
          test -s site/manifest.json
          test -s site/nexovmp_catalog.json
          test -s site/municipal/manifest.json
          test -f site/.nojekyll

          echo "Contenido preparado:"
          find site -maxdepth 3 -type f -print | sort

      - name: Publicar en rama gh-pages
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/nexovmp-pages
          mkdir -p /tmp/nexovmp-pages
          cp -a site/. /tmp/nexovmp-pages/

          git config user.name "NexoVMP Mirror Bot"
          git config user.email "nexovmp-mirror@users.noreply.github.com"

          git switch --orphan gh-pages

          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          cp -a /tmp/nexovmp-pages/. .

          git add -A
          git commit -m "chore: actualizar servidor secundario"

          git push --force origin gh-pages
